{% extends "base.html" %}
{% block title %}Admin - Qwalora Ranger{% endblock %}
{% block body %}
<section class="max-w-sm">
  <h1 class="text-xl font-semibold text-slate-100">Admin</h1>
  <p class="mt-2 text-sm text-slate-400">Enter the control-plane admin token.</p>
  {% if error %}
  <div class="mt-4 rounded-md border border-red-500/40 bg-red-500/10 px-3 py-2 text-sm text-red-300">{{ error }}</div>
  {% endif %}
  <form method="post" action="/admin/login" class="mt-6 space-y-4">
    <input type="password" name="token" required placeholder="admin token"
           class="w-full rounded-md bg-ink border border-edge px-3 py-2 text-sm text-slate-100 font-mono focus:border-ranger outline-none">
    <input type="hidden" name="next" value="{{ nxt }}">
    <button class="w-full rounded-md bg-ranger text-ink font-mono text-sm font-semibold py-2.5 hover:brightness-110">
      sign in
    </button>
  </form>
</section>
{% endblock %}
