---
# The per-ranger flags, injected from the portal's templateVars.ranger_flags.
# A dict of objective id -> flag token, e.g. {"kerberoast": "QR5{...}", ...}.
# Empty by default so the role is a no-op if nothing was passed.
qwalora_flags: {}

# Which board's objective -> location map to apply (5 = Raider, 6 = Vanguard).
qwalora_flags_board: 5

# Where "loot" flags that only need protected-filesystem placement go.
qwalora_flags_dir: 'C:\ProgramData\ranger'

# The GOAD lab variant these account names belong to. Bump/adjust the accounts
# below if your installed badsectorlabs.ludus_goad version seeds different names.
qwalora_goad_variant: 'GOAD'

# Principals used when a flag must be readable only by a specific account.
# IMPORTANT: the Qwalora portal PINS these per seed and passes them via
# templateVars at deploy time (scenarios.placement_vars -> qwalora_svc_account /
# qwalora_asrep_account), so the ACL lock always references the SAME account the
# approved scenario names. These values are only the standalone fallback for a
# manual run; a portal-driven deploy overrides them. Keep them aligned with your
# badsectorlabs.ludus_goad version for standalone use.
qwalora_svc_account: 'sql_svc'
qwalora_asrep_account: 'brandon.stark'

# Preflight: before planting, assert the referenced accounts actually resolve in
# AD, so a GOAD-version name mismatch fails LOUD on a DC instead of silently
# planting an unreadable flag. Set false to skip (e.g. an air-gapped re-run).
qwalora_flags_preflight: true

# Readback: after planting an ACL-restricted flag, stat it to confirm it landed.
qwalora_flags_verify: true

# Validate-only: run preflight (account/dir checks) and stop WITHOUT planting.
# The validate-flags.yml playbook sets this to dry-check a template.
qwalora_flags_validate_only: false

# Short hostnames that are domain controllers (where AD queries can run).
qwalora_dc_hostnames: [kingslanding, winterfell, braavos]
